<!doctype html><html><head><link rel="icon" type="image/png" href="./SIFT.png"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sift Popup</title>
<style>
/* Layout: a 360 x 540 extension popup on a quiet stage. Header with the page being read,
   an action row (copy, read, settings), then the saved-excerpt list. Settings slides over the list.
   Colours are the final Sift reader palette (Flexoki dark); single theme by choice. */
:root {
  --stage: #100F0F;
  --paper: #1C1B1A;
  --card: #282726;
  --terra: #3AA99F;
  --tint: #143F3C;
  --slate: #878580;
  --ink: #CECDC3;
  --rule: #343331;
  --hair: #403E3C;
  --sans: "Arial", "Helvetica Neue", system-ui, sans-serif;
  --serif: "Georgia", "Times New Roman", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  box-sizing: border-box;
  display: grid;
  grid-template-columns: minmax(0, 360px);
  grid-template-rows: minmax(0, 1fr);
  justify-content: center;
  padding-inline: 16px;
  padding-block: 16px;
  background: var(--stage);
  color: var(--ink);
  font-family: var(--serif);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--terra); outline-offset: 2px; border-radius: 6px; }

.popup {
  position: relative;
  align-self: center;
  height: 100%;
  max-height: 540px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--paper);
  border-radius: 14px;
  box-shadow: 0 0 0 1px var(--hair), 0 24px 48px -24px rgba(0, 0, 0, .55);
}

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 14px 8px; }
.brand { color: var(--terra); font: 700 14px/18px var(--sans); letter-spacing: .12em; }
.doc { display: flex; align-items: center; min-width: 0; min-height: 32px; color: var(--slate); font: 700 13px/16px var(--sans); letter-spacing: .08em; text-transform: uppercase; }
.doc span.t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* scratchpad */
.drawer { flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 0; overflow: hidden; }
.dhead { display: flex; align-items: center; justify-content: flex-end; flex-shrink: 0; padding-inline: 10px 4px; }
.ib { display: grid; place-items: center; width: 44px; height: 44px; color: var(--terra); border-radius: 8px; }
.brandgroup { display: flex; align-items: center; gap: 4px; }
.ib.sm { width: 32px; height: 32px; }
.dhead .ib { width: 32px; height: 32px; }
.dhead .ib svg { width: 16px; height: 16px; }
.dlist { opacity: .6; }
.ib[aria-pressed="true"] { background: var(--tint); }
.dlist { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px 10px 10px; scrollbar-width: thin; scrollbar-color: var(--hair) transparent; }
.chip { display: flex; align-items: flex-start; gap: 8px; padding: 8px 4px 8px 10px; background: var(--tint); border-left: 4px solid var(--terra); border-radius: 4px; user-select: text; -webkit-user-select: text; }
.chip .body { flex: 1; min-width: 0; }
.chip p { margin: 0; font-size: 14px; line-height: 21px; color: var(--ink); overflow-wrap: anywhere; }
.chip .src { display: block; margin-top: 4px; color: var(--slate); font: 700 10px/14px var(--sans); letter-spacing: .1em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .tag { display: inline-block; margin-bottom: 2px; padding: 1px 6px; border-radius: 3px; background: var(--terra); color: var(--paper); font: 700 9px/14px var(--sans); letter-spacing: .12em; }
.chip .rm { flex-shrink: 0; display: grid; place-items: center; width: 32px; height: 32px; color: var(--slate); font: 400 20px/1 var(--sans); border-radius: 6px; }
.empty { margin: 0; padding: 28px 16px; color: var(--slate); font-size: 14px; line-height: 21px; text-align: center; }

/* settings panel */
.panel { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; background: var(--paper); animation: slide .22s cubic-bezier(.2, .7, .2, 1); }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.phead { display: flex; align-items: center; gap: 4px; padding: 8px 14px 4px 8px; }
.phead h2 { margin: 0; color: var(--terra); font: 700 12px/16px var(--sans); letter-spacing: .12em; text-transform: uppercase; }
.pbody { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding: 6px 14px 14px; }
.set { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px dashed var(--rule); }
.set:last-child { border-bottom: 0; }
.set .lbl { min-width: 0; }
.set .lbl b { display: block; font: 700 13px/18px var(--sans); color: var(--ink); }
.set .lbl span { display: block; margin-top: 2px; font: 400 12px/17px var(--sans); color: var(--slate); }
.seg { display: flex; flex-shrink: 0; border: 1px solid var(--hair); border-radius: 8px; overflow: hidden; }
.seg button { min-width: 40px; min-height: 32px; padding: 0 10px; color: var(--slate); font: 700 12px/16px var(--sans); }
.seg button + button { border-left: 1px solid var(--hair); }
.seg button[aria-pressed="true"] { background: var(--terra); color: var(--paper); }
.sw { position: relative; flex-shrink: 0; width: 44px; height: 26px; border-radius: 13px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--hair); transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 18px; height: 18px; border-radius: 50%; background: var(--slate); transition: transform .15s, background .15s; }
.sw[aria-checked="true"] { background: var(--tint); box-shadow: inset 0 0 0 1px var(--terra); }
.sw[aria-checked="true"]::after { transform: translateX(18px); background: var(--terra); }
.sample { margin: 8px 0 0; padding: 12px; border: 1px dashed var(--rule); border-radius: 8px; font-weight: 700; color: var(--ink); text-wrap: pretty; }
.sample.s { font-size: 17px; line-height: 25px; }
.sample.m { font-size: 24px; line-height: 32px; }
.sample.l { font-size: 29px; line-height: 38px; }

.toast { position: absolute; left: 50%; bottom: 22px; z-index: 20; transform: translate(-50%, 8px); padding: 8px 14px; border-radius: 999px; background: var(--ink); color: var(--paper); font: 700 12px/16px var(--sans); letter-spacing: .04em; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="popup" id="popup">
  <header class="top">
    <div class="brandgroup">
      <span class="brand">SIFT</span>
      <button class="ib sm" id="settingBtn" aria-label="Sift settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
    <div class="doc" aria-label="Current article"><span class="t" id="docTitle">The Long Way Home</span></div>
  </header>

  <section class="drawer" id="drawer" aria-label="Scratchpad">
    <div class="dhead">
      <button class="ib" id="copyBtn" aria-label="Copy all excerpts">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect width="11.667" height="11.667" x="6.667" y="6.667" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></rect><path d="M3.333 13.333c-0.917 0-1.667-0.75-1.666-1.666V3.333c0-0.917 0.75-1.667 1.666-1.667h8.334c0.917 0 1.667 0.75 1.666 1.667" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      <button class="ib" id="readBtn" aria-label="Open reading view" aria-pressed="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v16"></path><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"></path></svg>
      </button>
    </div>
    <div class="dlist" id="dlist"></div>
  </section>

  <section class="panel" id="panel" hidden aria-label="Settings">
    <div class="phead">
      <button class="ib sm" id="backBtn" aria-label="Back to scratchpad">
        <svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2>Settings</h2>
    </div>
    <div class="pbody">
      <div class="set">
        <div class="lbl"><b>Text size</b><span>Active sentence in the reading view</span></div>
        <div class="seg" role="group" aria-label="Text size" data-key="size">
          <button data-v="s" aria-pressed="false">S</button>
          <button data-v="m" aria-pressed="true">M</button>
          <button data-v="l" aria-pressed="false">L</button>
        </div>
      </div>
      <p class="sample m" id="sample">There are a lot of different variants of this question.</p>
      <div class="set">
        <div class="lbl"><b>Seek speed</b><span>How far a drag moves through the text</span></div>
        <div class="seg" role="group" aria-label="Seek speed" data-key="speed">
          <button data-v="slow" aria-pressed="false">Slow</button>
          <button data-v="normal" aria-pressed="true">Normal</button>
          <button data-v="fast" aria-pressed="false">Fast</button>
        </div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var dlist = $('dlist'), toastEl = $('toast'), panel = $('panel'), toastTimer = null, uid = 0;

  var scratch = [
    { id: ++uid, type: 'q', text: 'The problem was never the article.', src: 'The Long Way Home' },
    { id: ++uid, type: 'q', text: 'I used to spend the ride with my head down, reading one article start to finish and arriving with nothing to show for it.', src: 'The Long Way Home' },
  ];

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1800);
  }

  function render() {
    dlist.replaceChildren();
    if (!scratch.length) {
      var e = document.createElement('p');
      e.className = 'empty';
      e.textContent = 'Nothing saved yet. Double-tap a sentence in the reading view and it lands here.';
      dlist.appendChild(e);
      return;
    }
    scratch.forEach(function (c) {
      var d = document.createElement('div'); d.className = 'chip';
      var b = document.createElement('div'); b.className = 'body';
      var p = document.createElement('p'); p.textContent = c.text; b.appendChild(p);
      var x = document.createElement('button'); x.className = 'rm'; x.setAttribute('aria-label', 'Remove from scratchpad'); x.textContent = '×';
      x.addEventListener('click', function () {
        scratch = scratch.filter(function (y) { return y.id !== c.id; });
        render();
      });
      d.appendChild(b); d.appendChild(x); dlist.appendChild(d);
    });
  }

  $('copyBtn').addEventListener('click', function () {
    if (!scratch.length) { toast('Nothing to copy yet'); return; }
    var text = scratch.slice().reverse().map(function (c) { return '“' + c.text + '” — ' + c.src; }).join('\n\n');
    var n = scratch.length, done = function () { toast('Copied ' + n + (n === 1 ? ' excerpt' : ' excerpts')); };
    try { navigator.clipboard.writeText(text).then(done, function () { toast('Copy blocked here. Select the text instead.'); }); }
    catch (err) { toast('Copy blocked here. Select the text instead.'); }
  });

  var reading = false;
  $('readBtn').addEventListener('click', function () {
    reading = !reading;
    $('readBtn').setAttribute('aria-pressed', String(reading));
  });

  $('settingBtn').addEventListener('click', function () { panel.hidden = false; $('backBtn').focus(); });
  $('backBtn').addEventListener('click', function () { panel.hidden = true; $('settingBtn').focus(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) { panel.hidden = true; } });

  document.querySelectorAll('.seg').forEach(function (seg) {
    seg.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        seg.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        if (seg.dataset.key === 'size') $('sample').className = 'sample ' + b.dataset.v;
      });
    });
  });

  render();
})();
</script>

</body></html>
