<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e22"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>

    <!-- Glowing focus sentence gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5e3a"/>
      <stop offset="50%" stop-color="#ff7d54"/>
      <stop offset="100%" stop-color="#ff9d6c"/>
    </linearGradient>

    <!-- Card gradient overlay -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Soft glow filter for active sentence horizon -->
    <filter id="focusGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Squircle -->
  <rect width="96" height="96" rx="22" fill="url(#bgGrad)"/>
  <rect width="94" height="94" x="1" y="1" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Stacked Receding Perspective Cards -->
  <!-- Card 1 (Furthest Back / Top) -->
  <rect x="29" y="16" width="38" height="24" rx="4" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <g fill="#ffffff" fill-opacity="0.12">
    <rect x="33" y="20" width="12" height="1.8" rx="0.9"/>
    <rect x="47" y="20" width="16" height="1.8" rx="0.9"/>
    <rect x="33" y="24" width="20" height="1.8" rx="0.9"/>
    <rect x="55" y="24" width="8" height="1.8" rx="0.9"/>
    <rect x="33" y="28" width="15" height="1.8" rx="0.9"/>
    <rect x="50" y="28" width="13" height="1.8" rx="0.9"/>
  </g>

  <!-- Card 2 (Middle Receding) -->
  <rect x="25" y="24" width="46" height="30" rx="5" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <g fill="#ffffff" fill-opacity="0.2">
    <rect x="29" y="29" width="16" height="2" rx="1"/>
    <rect x="47" y="29" width="20" height="2" rx="1"/>
    <rect x="29" y="34" width="24" height="2" rx="1"/>
    <rect x="55" y="34" width="12" height="2" rx="1"/>
    <rect x="29" y="39" width="14" height="2" rx="1"/>
    <rect x="45" y="39" width="22" height="2" rx="1"/>
  </g>

  <!-- Card 3 (Main Active Focus Card) -->
  <rect x="21" y="33" width="54" height="46" rx="6" fill="#18181c" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>

  <!-- Upper Context Lines (Dimmer prior text) -->
  <g fill="#ffffff" fill-opacity="0.28">
    <rect x="26" y="39" width="22" height="2.2" rx="1.1"/>
    <rect x="50" y="39" width="16" height="2.2" rx="1.1"/>
    <rect x="26" y="44" width="14" height="2.2" rx="1.1"/>
    <rect x="42" y="44" width="24" height="2.2" rx="1.1"/>
    <rect x="26" y="49" width="18" height="2.2" rx="1.1"/>
    <rect x="46" y="49" width="20" height="2.2" rx="1.1"/>
  </g>

  <!-- THE ACTIVE FOCUS HORIZON (Glowing Sift Sentence) -->
  <g filter="url(#focusGlow)">
    <rect x="25" y="55" width="12" height="4.5" rx="2.25" fill="url(#glowGrad)"/>
    <rect x="39" y="55" width="20" height="4.5" rx="2.25" fill="url(#glowGrad)"/>
    <rect x="61" y="55" width="10" height="4.5" rx="2.25" fill="url(#glowGrad)"/>
  </g>

  <!-- Lower Context Lines (Subsequent text) -->
  <g fill="#ffffff" fill-opacity="0.22">
    <rect x="30" y="64" width="18" height="2.2" rx="1.1"/>
    <rect x="50" y="64" width="16" height="2.2" rx="1.1"/>
    <rect x="34" y="69" width="28" height="2.2" rx="1.1"/>
  </g>
</svg>
