<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <!-- Flexoki dark stage gradient -->
    <linearGradient id="stageBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1B1A"/>
      <stop offset="100%" stop-color="#100F0F"/>
    </linearGradient>

    <!-- Flexoki cyan / terra glow -->
    <linearGradient id="terraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="50%" stop-color="#3AA99F"/>
      <stop offset="100%" stop-color="#2c837b"/>
    </linearGradient>

    <!-- Flexoki card surface fill -->
    <linearGradient id="cardFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282726"/>
      <stop offset="100%" stop-color="#1e1d1c"/>
    </linearGradient>

    <!-- Cyan aura glow filter -->
    <filter id="cyanAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Squircle (Flexoki --stage / --paper) -->
  <rect width="96" height="96" rx="22" fill="url(#stageBg)"/>
  <rect width="94" height="94" x="1" y="1" rx="21" fill="none" stroke="#403E3C" stroke-width="1"/>

  <!-- Layer 1: Top Reading Sheet (Dimmed) -->
  <polygon points="48,19 72,31 48,43 24,31" fill="url(#cardFill)" stroke="#403E3C" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="34" y1="31" x2="62" y2="31" stroke="#878580" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.35"/>

  <!-- Layer 2: Middle Reading Sheet -->
  <polygon points="48,31 72,43 48,55 24,43" fill="url(#cardFill)" stroke="#403E3C" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="32" y1="43" x2="64" y2="43" stroke="#878580" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45"/>

  <!-- Layer 3: Active Reading Sheet & Sift Horizon -->
  <polygon points="48,43 72,55 48,67 24,55" fill="url(#cardFill)" stroke="#403E3C" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Glowing Focus Horizon (Flexoki --terra #3AA99F) -->
  <!-- Ambient halo behind the focus edge -->
  <polyline points="24,55 48,67 72,55" fill="none" stroke="#143F3C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#cyanAura)"/>
  <!-- Sharp glowing cyan focal line -->
  <polyline points="24,55 48,67 72,55" fill="none" stroke="url(#terraGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanAura)"/>
  <!-- Inner intense core -->
  <polyline points="25,55 48,66.5 71,55" fill="none" stroke="#E6FFFA" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
